<!DOCTYPE html>
<html><head>
<title>Courses - David Paul Academy</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow-x:hidden}
.glitch-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;background:#000}
.glitch-bg::before,.glitch-bg::after{
content:'';position:absolute;top:0;left:0;width:100%;height:100%;
background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,215,0,0.03) 2px, rgba(255,215,0,0.03) 4px);
animation:glitchMove 0.3s infinite;
}
.glitch-bg::after{background:linear-gradient(90deg, rgba(255,0,128,0.1), rgba(0,255,255,0.1), rgba(255,255,0,0.1));mix-blend-mode:screen;animation:rgbShift 0.2s infinite}
@keyframes glitchMove{0%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(2px,-2px)}60%{transform:translate(-1px,1px)}80%{transform:translate(1px,-1px)}100%{transform:translate(0)}}
@keyframes rgbShift{0%{transform:translate(0);filter:hue-rotate(0deg)}50%{transform:translate(3px,0);filter:hue-rotate(90deg)}100%{transform:translate(-3px,0);filter:hue-rotate(180deg)}}
.content{max-width:700px;margin:auto;padding:20px;position:relative;z-index:2}
.card{background:rgba(15,15,15,0.9);border:1px solid #333;border-radius:16px;padding:22px;margin:20px 0;position:relative;overflow:hidden;animation:cardGlitch 4s infinite}
@keyframes cardGlitch{0%,90%,100%{transform:translate(0);box-shadow:0 10px 30px rgba(255,215,0,0.1)}91%{transform:translate(-2px,1px);box-shadow:-3px 0 #ff0080, 3px 0 #00ffff}92%{transform:translate(2px,-1px)}93%{transform:translate(0)}}
.btn{display:block;background:#FFD700;color:#000;padding:14px;text-align:center;border-radius:30px;text-decoration:none;font-weight:bold;margin-top:12px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:shine 2.5s infinite}
@keyframes shine{0%{left:-100%}100%{left:100%}}
.locked{background:#222;padding:12px;border-radius:8px;margin-top:10px;border-left:4px solid #FFD700;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
a{color:#FFD700}
.scanline{position:fixed;top:0;left:0;width:100%;height:2px;background:rgba(255,215,0,0.5);box-shadow:0 0 10px #FFD700;animation:scan 3s linear infinite;z-index:10}
@keyframes scan{0%{top:0}100%{top:100%}}
</style>
</head><body>
<div class="glitch-bg"></div>
<div class="scanline"></div>
<div class="content">
<a href="index.html">← Back Home</a>
<h1 style="color:#FFD700;margin:20px 0;text-shadow:2px 0 #ff0080, -2px 0 #00ffff">My Courses</h1>
<div class="card">
<h2>Zero to First Sale</h2>
<p style="opacity:0.8;margin:10px 0">For beginners with 5k-10k capital.</p>
<a class="btn" href="enroll.html">Open Course →</a>
<div class="locked">🔒 Click Open to unlock access - Payment go show</div>
</div>
</div>
</body></html>
