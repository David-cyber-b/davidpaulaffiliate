<!DOCTYPE html>
<html><head>
<title>Unlock Course</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;background:radial-gradient(ellipse at top, #332500, #000 70%)}
.floating{position:absolute;width:100%;height:100%;z-index:-1}
.dot{position:absolute;width:6px;height:6px;background:#FFD700;border-radius:50%;animation:up 6s infinite}
@keyframes up{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}
.box{
width:90%;max-width:450px;background:rgba(17,17,17,0.95);border:1px solid #333;
padding:35px;border-radius:20px;text-align:center;
transform:perspective(1000px) rotateX(5deg);
animation:floatBox 4s ease-in-out infinite;
box-shadow:0 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255,215,0,0.15);
}
@keyframes floatBox{0%,100%{transform:perspective(1000px) rotateX(5deg) translateY(0)}50%{transform:perspective(1000px) rotateX(5deg) translateY(-10px)}}
.price{font-size:48px;color:#FFD700;font-weight:900;text-shadow:0 0 30px rgba(255,215,0,0.6);margin:15px 0;animation:glow 2s infinite alternate}
@keyframes glow{0%{text-shadow:0 0 20px rgba(255,215,0,0.4)}100%{text-shadow:0 0 40px rgba(255,215,0,0.8)}}
.btn{display:block;background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;padding:16px;border-radius:30px;text-decoration:none;font-weight:bold;margin:12px 0;transform:translateZ(20px);transition:0.3s;box-shadow:0 8px 20px rgba(255,215,0,0.3)}
.btn:hover{transform:translateZ(30px) scale(1.03)}
.btn2{background:#25D366;color:#fff;box-shadow:0 8px 20px rgba(37,211,102,0.3)}
.lock-icon{font-size:60px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head><body>
<div class="bg"></div>
<div class="floating" id="dots"></div>

<div class="box">
<div class="lock-icon">🔒</div>
<h2 style="color:#FFD700;margin-top:10px">Pay to Unlock</h2>
<p style="opacity:0.8;margin:10px 0">Access <b>Zero to First Sale</b> course</p>
<p style="font-size:13px;opacity:0.5">One-time • Lifetime access • Instant delivery</p>
<div class="price">₦5,000</div>
<a class="btn" href="https://paystack.com/pay/YOUR_LINK_HERE">💳 Pay with Paystack</a>
<a class="btn btn2" href="https://wa.me/234YOURNUMBER?text=I%20want%20to%20pay%20for%20Zero%20to%20First%20Sale">💬 Pay via WhatsApp</a>
<p style="font-size:11px;opacity:0.4;margin-top:15px">After payment, send proof & get access instantly</p>
<a href="courses.html" style="color:#FFD700;font-size:13px;display:block;margin-top:20px">← Back to Courses</a>
</div>

<script>
const container=document.getElementById('dots');
for(let i=0;i<20;i++){
let d=document.createElement('div');
d.className='dot';
d.style.left=Math.random()*100+'%';
d.style.animationDelay=Math.random()*6+'s';
d.style.animationDuration=(4+Math.random()*4)+'s';
container.appendChild(d);
}
</script>
</body></html>
