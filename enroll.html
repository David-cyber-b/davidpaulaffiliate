<!DOCTYPE html>

<style>

.bg{position:fixed;inset:0;background:#000;z-index:-2}

.btn{display:block;background:#FFD700;color:#000;padding:16px;border-radius:30px;text-decoration:none;font-weight:bold;margin:12px 0}
